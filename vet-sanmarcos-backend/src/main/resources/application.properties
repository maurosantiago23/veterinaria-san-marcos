server.port=8080
spring.application.name=vet-sanmarcos-backend

# ========================================================
# CONEXIÓN A ORACLE CLOUD (ATP WALLET)
# ========================================================
# NOTA DE ENTORNO LOCAL / DESARROLLO:
# La ruta absoluta en TNS_ADMIN corresponde al ambiente local de pruebas del desarrollador
# debido a que en este equipo no se utiliza Oracle SQL Developer de escritorio, realizandose
# la verificacion y consumo de la base de datos Autonomous de forma directa a traves de Spring Boot.
# En despliegue (ej. AWS EC2), esta ruta se adapta al directorio del servidor (ej. /home/ec2-user/wallet).
# En rutas de Windows para Spring Boot se utilizan barras inclinadas hacia adelante (/).
spring.datasource.url=jdbc:oracle:thin:@vetsanmarcos_low?TNS_ADMIN=C:/Users/mauro/Downloads/veterinaria-san-marcos/wallet
spring.datasource.username=VET_USER
spring.datasource.password=VetSanMarcos2026#
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ========================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ========================================================
# "none" es fundamental para NO borrar ni recrear las tablas que ya creaste en Oracle
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# ========================================================
# SWAGGER / OPENAPI (Rutas de documentación)
# ========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ========================================================
# SEGURIDAD Y FIRMA DE TOKENS JWT
# ========================================================
jwt.secret=SanMarcosClaveSecretaSuperSeguraEvaluacion3DuocUC2026ParaFirmarTokensJWT
jwt.expiration=86400000