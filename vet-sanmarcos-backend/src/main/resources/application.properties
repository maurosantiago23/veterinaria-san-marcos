server.port=8080
spring.application.name=vet-sanmarcos-backend

# ========================================================
# CONEXIÓN A ORACLE CLOUD (ATP WALLET)
# ========================================================
# La ruta de la Wallet (TNS_ADMIN) se detecta y configura automaticamente en VetSanmarcosBackendApplication
# tanto para desarrollo en Windows como para despliegue en Linux (AWS EC2).
spring.datasource.url=jdbc:oracle:thin:@vetsanmarcos_low
spring.datasource.username=VET_USER
spring.datasource.password=VetSanMarcos2026#
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ========================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ========================================================
# "none" es fundamental para NO borrar ni recrear las tablas que ya creaste en Oracle
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
# ========================================================
# SWAGGER / OPENAPI (Rutas de documentación)
# ========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ========================================================
# SEGURIDAD Y FIRMA DE TOKENS JWT
# ========================================================
jwt.secret=SanMarcosClaveSecretaSuperSeguraEvaluacion3DuocUC2026ParaFirmarTokensJWT
jwt.expiration=86400000